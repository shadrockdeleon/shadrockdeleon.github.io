    <style>
        .container {
            width: min(1180px, 89%);
            margin-left: auto;
            margin-right: auto;
        }

        /* Academic Project Header */
        .academic-header {
            padding: 65px 0 50px;
            border-bottom: 1px solid #d8d3c9;
        }

        .academic-header .back-link {
            display: inline-block;
            font-size: 11px;
            letter-spacing: .14em;
            margin-bottom: 65px;
            text-decoration: none;
        }

        .academic-header .back-link:hover {
            opacity: .55;
        }

        .academic-header .eyebrow {
            margin-bottom: 22px;
        }

        .academic-header h1 {
            font-size: clamp(42px, 6vw, 76px);
            line-height: 1.02;
            letter-spacing: -.06em;
            font-weight: 500;
            margin: 0;
            max-width: 1050px;
        }

        /* Thesis Presentation Sheets */
        .academic-project {
            padding: 50px 0 80px;
        }

        .academic-gallery {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .academic-gallery img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Mobile Layout */
        @media (max-width: 700px) {
            .academic-header {
                padding: 45px 0 35px;
            }

            .academic-header .back-link {
                margin-bottom: 45px;
            }

            .academic-header h1 {
                font-size: clamp(38px, 10vw, 56px);
            }

            .academic-project {
                padding: 35px 0 55px;
            }

            .academic-gallery {
                gap: 20px;
            }
        }
    </style>
</head>
